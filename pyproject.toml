[project]
name = "penpal"
version = "0.1.0"
description = "Unified plotter art library"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "shapely>=2.0",
    "scipy>=1.10",
    "opensimplex>=0.4",
]

[project.optional-dependencies]
cv = ["opencv-python>=4.7", "scikit-image>=0.20"]
rl = ["gymnasium>=0.28", "pycairo>=1.24"]
all = ["penpal[cv,rl]"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "jupyterlab>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
